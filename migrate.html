<!doctype html>
<meta charset="utf-8">
<title>N17 Tap has moved</title>
<script>
const NEW_HOME = 'https://play-postie.pages.dev/n17/';
const ALLOWED = ['https://play-postie.pages.dev/', 'http://localhost:8765/'];
const requested = new URLSearchParams(location.search).get('return');
const target = requested && ALLOWED.some(o => requested.startsWith(o)) ? requested : NEW_HOME;
const data = {};
try {
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('n17tap-')) data[k] = localStorage.getItem(k);
  }
} catch (e) {}
const bytes = new TextEncoder().encode(JSON.stringify(data));
const payload = btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
location.replace(target.split('#')[0] + '#n17tap=' + payload);
</script>
<p>N17 Tap has moved to <a href="https://play-postie.pages.dev/n17/">play-postie.pages.dev/n17</a>.</p>
